name: Tests

on:
    push:
        branches: [ "*.x" ]
    pull_request:
        branches: [ "*.x" ]

permissions:
    contents: read

jobs:
    build:
        name: PHP ${{ matrix.php }} + Symfony ${{ matrix.symfony }}
        runs-on: ubuntu-latest

        strategy:
            # Don't cancel the whole matrix when one combination fails:
            # we want to see every PHP/Symfony result independently.
            fail-fast: false
            matrix:
                # Explicit include-list. Impossible combos are simply not listed
                # (Symfony 7.4 requires PHP >= 8.2, Symfony 8.1 requires PHP >= 8.4).
                # Symfony 7.0-7.3 and 8.0 are EOL and uninstallable under modern Composer
                # (every release is blocked by security advisories), so the 7.x line
                # is covered by 7.4 (the lowest maintained 7.x) and the 8.x line by 8.1.
                include:
                    - { php: '8.2', symfony: '6.4.*', dbal: '^3.8', easyadmin: '5.10.2' }    # bundle PHP floor + Symfony LTS floor + EasyAdmin floor
                    - { php: '8.4', symfony: '6.4.*', dbal: '^4.0', easyadmin: '^5.10.2' }   # LTS on the newest PHP (catches deprecations)
                    - { php: '8.3', symfony: '7.4.*', dbal: '^3.8', easyadmin: '^5.10.2' }   # lowest maintained 7.x on a recent PHP
                    - { php: '8.5', symfony: '7.4.*', dbal: '^4.0', easyadmin: '^5.10.2' }
                    - { php: '8.4', symfony: '8.1.*', dbal: '^4.0', easyadmin: '^5.10.2' }
                    - { php: '8.5', symfony: '8.1.*', dbal: '^4.0', easyadmin: '^5.10.2' }

        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: jmonitor_test
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=10
            postgres:
                image: postgres:17
                env:
                    POSTGRES_PASSWORD: root
                    POSTGRES_DB: jmonitor_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd="pg_isready -U postgres"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=10

        env:
            JMONITOR_TEST_MYSQL_URL: mysql://root:root@127.0.0.1:3306/jmonitor_test
            JMONITOR_TEST_PGSQL_URL: postgresql://postgres:root@127.0.0.1:5432/jmonitor_test

        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP ${{ matrix.php }}
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none
                  tools: composer:v2

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer packages
              uses: actions/cache@v4
              with:
                  # Cache Composer's download cache (not vendor/): each matrix job
                  # installs a different Symfony set, so vendor/ must not be shared.
                  path: ${{ steps.composer-cache.outputs.dir }}
                  # Key includes PHP + Symfony version so jobs never collide, and
                  # busts when composer.json changes (no per-matrix lock is committed).
                  key: ${{ runner.os }}-php${{ matrix.php }}-sf${{ matrix.symfony }}-${{ hashFiles('composer.json') }}
                  restore-keys: |
                      ${{ runner.os }}-php${{ matrix.php }}-sf${{ matrix.symfony }}-

            - name: Install Symfony Flex
              # Flex reads SYMFONY_REQUIRE and pins every symfony/* package (direct
              # and transitive) to the targeted line in a single composer update.
              run: |
                  composer global config --no-plugins allow-plugins.symfony/flex true
                  composer global require --no-progress --no-scripts --no-plugins symfony/flex

            - name: Pin doctrine/dbal
              run: composer require --dev --no-update "doctrine/dbal:${{ matrix.dbal }}"

            - name: Pin easycorp/easyadmin-bundle
              run: composer require --dev --no-update "easycorp/easyadmin-bundle:${{ matrix.easyadmin }}"

            - name: Install dependencies (Symfony ${{ matrix.symfony }})
              env:
                  SYMFONY_REQUIRE: ${{ matrix.symfony }}
              run: composer update --prefer-dist --no-progress

            - name: lint
              run: composer run-script lint:check

            - name: phpstan
              run: composer run-script phpstan

            - name: phpunit
              run: composer run-script phpunit

    without-easyadmin:
        name: PHP 8.4 without EasyAdmin
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP 8.4
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none
                  tools: composer:v2

            - name: Remove easycorp/easyadmin-bundle
              run: composer remove --dev --no-update easycorp/easyadmin-bundle

            - name: Install dependencies
              run: composer update --prefer-dist --no-progress

            # phpstan needs the EasyAdmin classes that src/EasyAdmin names; lint runs in the build job.
            - name: phpunit
              run: ./vendor/bin/phpunit tests --exclude-group easyadmin

    e2e-fpm:
        name: End-to-end under PHP-FPM
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP 8.4
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none
                  tools: composer:v2

            - name: Install dependencies
              run: composer update --prefer-dist --no-progress

            - name: End-to-end run
              run: sh tests/E2E/fpm/run.sh

    e2e-frankenphp-worker:
        name: End-to-end under FrankenPHP worker mode
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP 8.4
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none
                  tools: composer:v2

            - name: Install dependencies
              run: composer update --prefer-dist --no-progress

            - name: End-to-end run
              run: sh tests/E2E/frankenphp-worker/run.sh
