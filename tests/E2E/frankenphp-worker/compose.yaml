name: jmonitor-bundle-e2e-worker

services:
  app:
    build:
      context: .
      dockerfile_inline: |
        FROM dunglas/frankenphp:1.13.0-php8.4
        RUN install-php-extensions pdo_mysql pdo_pgsql redis
    working_dir: /app
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      JMONITOR_FLUSH_INTERVAL: "${JMONITOR_FLUSH_INTERVAL:-1}"
      JMONITOR_FIXTURE_FEATURES: "${JMONITOR_FIXTURE_FEATURES:-}"
      JMONITOR_FIXTURE_FRANKENPHP_ENDPOINT: "${JMONITOR_FIXTURE_FRANKENPHP_ENDPOINT:-}"
      JMONITOR_FIXTURE_MYSQL_URL: mysql://jmonitor:jmonitor@database:${JMONITOR_E2E_MYSQL_PORT:-33307}/jmonitor
      JMONITOR_FIXTURE_PGSQL_URL: postgresql://jmonitor:jmonitor@database:${JMONITOR_E2E_PGSQL_PORT:-35433}/jmonitor
      JMONITOR_FIXTURE_REDIS_URL: redis://database:${JMONITOR_E2E_REDIS_PORT:-36380}
      JMONITOR_E2E_WORKERS: "${JMONITOR_E2E_WORKERS:-1}"
    ports:
      - "${JMONITOR_E2E_PORT:-8090}:80"
    volumes:
      - ../../..:/app:ro
      - ./Caddyfile:/etc/frankenphp/Caddyfile:ro
    # Reached through its published port, a stopped server leaves a closed port; under its service name, it would leave a name that the resolver of Docker can take seconds to deny.
    extra_hosts:
      - "database:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: jmonitor
      MYSQL_USER: jmonitor
      MYSQL_PASSWORD: jmonitor
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "${JMONITOR_E2E_MYSQL_PORT:-33307}:3306"
    volumes:
      - ../../mysql-init.sql:/docker-entrypoint-initdb.d/mysql-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ujmonitor", "-pjmonitor"]
      interval: 2s
      timeout: 3s
      retries: 30

  postgres:
    image: postgres:17
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_DB: jmonitor
      POSTGRES_USER: jmonitor
      POSTGRES_PASSWORD: jmonitor
    ports:
      - "${JMONITOR_E2E_PGSQL_PORT:-35433}:5432"
    volumes:
      - ../../postgres-init.sql:/docker-entrypoint-initdb.d/postgres-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jmonitor -d jmonitor -h 127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    ports:
      - "${JMONITOR_E2E_REDIS_PORT:-36380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
